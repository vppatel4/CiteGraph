name: CI

# Runs on every push and PR. Lint + unit tests always run and are fast. The
# docker smoke test builds the whole stack and runs one end-to-end question.
# Nothing here deploys anything — everything happens in the runner and is torn
# down at the end.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light test deps
        # Only the dependencies the pure-logic tests need — no torch, so this is fast.
        run: pip install numpy scikit-learn pydantic-settings joblib pytest
      - name: Run tests
        working-directory: agent-service
        run: python -m pytest -q

  go-tests:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate gRPC stubs
        working-directory: gateway
        run: |
          mkdir -p internal/pb
          protoc -I ../proto \
            --go_out=. --go_opt=module=github.com/vppatel4/citegraph/gateway \
            --go-grpc_out=. --go-grpc_opt=module=github.com/vppatel4/citegraph/gateway \
            ../proto/citegraph.proto
      - name: Test
        working-directory: gateway
        run: |
          go mod tidy
          go vet ./...
          go test ./...

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: frontend
        run: |
          npm install
          npm run build

  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    # This is the slow one (builds images, pulls a small model). Let it run but
    # don't let a flaky model download block merges of unrelated changes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        # The agent image (torch + ML deps) plus the Ollama and pgvector images
        # can exhaust the runner's ~14 GB. Reclaim space the runner isn't using.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h
      - name: Prepare env (use a tiny model to keep CI fast)
        run: |
          cp .env.example .env
          echo "OLLAMA_MODEL=qwen2.5:0.5b" >> .env
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Disk after build
        if: always()
        run: df -h
      - name: Run the smoke test
        env:
          READY_TIMEOUT: "900"
        run: bash scripts/smoke_test.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
