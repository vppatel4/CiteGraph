server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the built single-page app; fall back to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API and health calls to the Go gateway container.
    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32m;
    }
    location /healthz {
        proxy_pass http://gateway:8080/healthz;
    }
}
